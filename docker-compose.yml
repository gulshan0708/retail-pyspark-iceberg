services:
  spark-iceberg:
    image: tabulario/spark-iceberg
    container_name: retail-spark
    depends_on:
      - rest
      - minio
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=us-east-1
    ports:
      - "8888:8888"   # Jupyter (bundled, optional)
      - "8080:8080"   # Spark master UI
      - "4040:4040"   # Spark application UI (visible while a job runs)
    volumes:
      - ./:/home/iceberg/project   # mounts your local repo into the container
    networks:
      - retail-net

  rest:
    image: apache/iceberg-rest-fixture:latest
    container_name: retail-iceberg-rest
    ports:
      - "8181:8181"
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=us-east-1
      - CATALOG_WAREHOUSE=s3://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://minio:9000
    networks:
      - retail-net

  minio:
    image: rustfs/rustfs:latest
    container_name: retail-minio
    environment:
      - RUSTFS_ACCESS_KEY=minioadmin
      - RUSTFS_SECRET_KEY=minioadmin
      - RUSTFS_ADDRESS=:9000
      - RUSTFS_CONSOLE_ADDRESS=:9001
      - RUSTFS_CONSOLE_ENABLE=true
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - retail-net

  bucket-init:
    image: amazon/aws-cli
    container_name: retail-bucket-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      aws --endpoint-url http://minio:9000 s3 mb s3://warehouse || true;
      "
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_REGION=us-east-1
    networks:
      - retail-net

  postgres:
    image: postgres:16
    container_name: retail-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=retail
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - retail-net

networks:
  retail-net:
    driver: bridge

volumes:
  minio-data:
  postgres-data: