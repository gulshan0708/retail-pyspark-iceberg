x-airflow-common: &airflow-common
  build: ./airflow                       # our image: Airflow plus the Docker client library
  image: retail-airflow:3.3.2
  profiles: ["airflow"]                  # started only with: docker compose --profile airflow ...
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: retail-local-dev-jwt-secret-0123456789
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
  networks:
    - retail-net


services:
  spark-iceberg:
    image: tabulario/spark-iceberg
    container_name: retail-spark
    depends_on:
      - rest
      - minio
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=us-east-1
    ports:
      - "8888:8888"   # Jupyter (bundled, optional)
      - "8080:8080"   # Spark master UI
      - "4040:4040"   # Spark application UI (visible while a job runs)
    volumes:
      - ./:/home/iceberg/project   # mounts your local repo into the container
    networks:
      - retail-net

  rest:
    image: apache/iceberg-rest-fixture:latest
    container_name: retail-iceberg-rest
    ports:
      - "8181:8181"
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=us-east-1
      - CATALOG_WAREHOUSE=s3://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://minio:9000
      - CATALOG_S3_PATH__STYLE__ACCESS=true
      - CATALOG_URI=jdbc:sqlite:file:/data/iceberg_catalog.db
    networks:
      - retail-net
    user: "0:0"
    volumes:
      - rest-data:/data

  minio:
    image: rustfs/rustfs:latest
    container_name: retail-minio
    environment:
      - RUSTFS_ACCESS_KEY=minioadmin
      - RUSTFS_SECRET_KEY=minioadmin
      - RUSTFS_ADDRESS=:9000
      - RUSTFS_CONSOLE_ADDRESS=:9001
      - RUSTFS_CONSOLE_ENABLE=true
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - retail-net

  bucket-init:
    image: amazon/aws-cli
    container_name: retail-bucket-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      aws --endpoint-url http://minio:9000 s3 mb s3://warehouse || true;
      "
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_REGION=us-east-1
    networks:
      - retail-net

  postgres:
    image: postgres:16
    container_name: retail-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=retail
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - retail-net

  airflow-postgres:
    image: postgres:16
    container_name: retail-airflow-postgres
    profiles: ["airflow"]
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - airflow-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - retail-net

  airflow-init:
    <<: *airflow-common
    container_name: retail-airflow-init
    command: ["db", "migrate"]           # creates or upgrades Airflow's own tables, then exits
    depends_on:
      airflow-postgres:
        condition: service_healthy

  airflow-api-server:
    <<: *airflow-common
    container_name: retail-airflow-api
    command: ["api-server"]
    ports:
      - "8081:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  airflow-dag-processor:
    <<: *airflow-common
    container_name: retail-airflow-dag-processor
    command: ["dag-processor"]
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: retail-airflow-scheduler
    command: ["scheduler"]
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock   # lets tasks run commands in the Spark container
    depends_on:
      airflow-init:
        condition: service_completed_successfully


networks:
  retail-net:
    driver: bridge

volumes:
  minio-data:
  postgres-data:
  rest-data:
  airflow-pg-data:
